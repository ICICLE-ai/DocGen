name: Build & deploy docs

# Runs on every push to main, and only then. You decide when the site changes:
# build and check locally, push, and this workflow rebuilds and deploys.
#
# Needs NO secrets: the built-in, read-only GITHUB_TOKEN is only used to call
# api.github.com for public data. AI is never called here. Section decisions made
# locally by the docgen-map skill live in docgen.mapping.json (committed), so this run
# applies the same decisions you approved. READMEs are fetched fresh, so upstream edits
# made after your local preview are included.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Skips the build quietly (no red ✗) in the DocGen template repository itself and in a
  # hub whose docgen.config.json still has the YOUR-… placeholder, e.g. the first commit of
  # a repo just created from the template.
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Checkout config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: docgen.config.json
          sparse-checkout-cone-mode: false

      - name: Configured hub?
        id: check
        env:
          IS_TEMPLATE: ${{ github.event.repository.is_template }}
        run: |
          if [ "$IS_TEMPLATE" = "true" ]; then
            echo "::notice::This is the DocGen template repository: nothing to build or deploy. Create a hub from it with 'Use this template'."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif grep -q 'YOUR-' docgen.config.json; then
            echo "::notice::docgen.config.json still has the YOUR-USERNAME-OR-ORG placeholder: skipping build and deploy until it is configured."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Read GitHub Pages URL
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Preflight
        run: npm run doctor

      - name: Ingest READMEs from GitHub (uses docgen.mapping.json)
        run: npm run ingest
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build site
        run: npm run build
        env:
          DOCGEN_SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Link check (no 404s)
        run: npm run check

      - name: Leak scan
        run: npm run scan

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
